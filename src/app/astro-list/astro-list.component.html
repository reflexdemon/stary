<div class="row mb-3">
  <div class="col">
    <select class="form-select" [(ngModel)]="selectedMonth" name="month">
      @for (m of months; track m.value) {
        <option [ngValue]="m.value">{{ m.label }}</option>
      }
    </select>
  </div>
  <div class="col">
    <select class="form-select" [(ngModel)]="selectedYear" name="year">
      @for (y of years; track y) {
        <option [ngValue]="y">{{ y }}</option>
      }
    </select>
  </div>
  <div class="col-auto d-flex gap-1">
    <button class="btn btn-outline-secondary" (click)="prevMonth()" title="Previous month">&larr;</button>
    <button class="btn btn-primary" (click)="viewList()">View List</button>
    <button class="btn btn-outline-secondary" (click)="nextMonth()" title="Next month">&rarr;</button>
  </div>
</div>
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
  @for (item of response; track item) {
    <div class="col">
      <div class="card h-100" [class.today]="isToday(item)">
        <div class="card-body">
          <div class="d-flex align-items-center gap-2 mb-2">
            <img [src]="item.rashiImg" [alt]="item.rashi" class="rounded" width="32" height="32">
            <span class="fw-semibold">{{ item.rashi }}</span>
          </div>
          <dl class="row mb-0 small">
            <dt class="col-4 fw-bold text-muted">Date</dt>
            <dd class="col-8 mb-1">{{ formatDate(item) }}</dd>
            <dt class="col-4 fw-bold text-muted">Time</dt>
            <dd class="col-8 mb-1">{{ to12h(item.birthTime) }}</dd>
            <dt class="col-4 fw-bold text-muted">Nakshatra</dt>
            <dd class="col-8 mb-1">{{ item.nakshatra }}</dd>
            <dt class="col-4 fw-bold text-muted">Chandrashtama</dt>
            <dd class="col-8 mb-1">{{ item.chandrashtama }}</dd>
            <dt class="col-4 fw-bold text-muted">Dhasa</dt>
            <dd class="col-8 mb-0">{{ item.currentDasha }}</dd>
          </dl>
        </div>
      </div>
    </div>
  }
</div>
